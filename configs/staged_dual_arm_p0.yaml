schema_version: 2
mode: mock_only
model: casbot_20251015_nominal_fixed_waist_dual
control_period_ns: 2000000
sample_period_ns: 1000000
integration_ns: 50000
timing_integration_ns: 25000  # pulse / stick-slip transitions require finer convergence
collision_scene: configs/collision_scene.yaml
home_rad: [0, 0.45, 0, -0.9, 0, 0, 0, 0, -0.45, 0, -0.9, 0, 0, 0]
pose_amplitude_rad: [0.4, 0.18, 0.35, 0.4, 0.5, 0.4, 0.5, 0.4, 0.18, 0.35, 0.4, 0.5, 0.4, 0.5]
settle_s: 0.6
transition_s: 1.0
gravity_train_poses: 24
gravity_validation_poses: 8
gravity_hold_s: 1.4
friction_poses: 2
friction_stroke_half_rad: 0.08
friction_sample_period_ns: 250000
friction_convergence_sample_period_ns: 125000
friction_speeds_rad_s: [0.04, 0.08, 0.14]
breakaway_dwell_s: [0.5, 1.5]
breakaway_ramp_s: 1.0
breakaway_slopes_nm_s: [0.12, 0.24]
breakaway_repeats: 2
breakaway_tracking_allowance_nm: 0.08
breakaway_motion_allowance_rad: 0.003
dynamic_period_s: 6.0
dynamic_periods: 4
dynamic_transition_s: 2.0
dynamic_candidate_seeds: [27, 28, 29]
inertia_sample_period_ns: 250000
wrist_probe:
  frequency_hz: 5.0
  amplitude_rad: 0.004
  bias_speed_rad_s: 0.18
  duration_s: 2.0
drive:
  gain_nm_a: 2.0
  gain_status: synthetic_declared
  current_tau: 0.001
  command_delay_ns: 1350000
  feedback_delay_ns: 700000
  torque_limit_nm: 100.0
  position_noise_rad: 0.0000001
  current_noise_a: 0.0002
  kp: [150, 150, 80, 80, 20, 15, 10, 150, 150, 80, 80, 20, 15, 10]
  kd: [10, 10, 5, 5, 1, 1, 0.7, 10, 10, 5, 5, 1, 1, 0.7]
acceptance:
  gravity_pair_rmse_nm: 0.01
  gravity_absolute_rmse_nm: 0.08
  friction_absolute_rmse_nm: 0.02
  dynamic_normalized_rmse: 0.05
  torque_floor_nm: 0.2
mock:
  seed: 20261028
  mass_scales: [1.15, 0.9, 1.08, 1.2, 0.85, 1.1, 0.95, 0.9, 1.18, 0.87, 1.12, 1.2, 0.92, 1.1]
  com_offset_m: 0.003
  inertia_shape_scale: 1.08
  viscous_nm_s_rad: 0.035
  coulomb_nm: 0.04
  static_friction_nm: 0.07
notes:
  - All parameters are synthetic, not manufacturer capabilities or measured limits.
  - Common home must be independently verified before executing any real trial.
  - Torque-ramp reference is a hold; realised displacement is checked after Mock collection.

# R1 resolves certified references; final test still waits for R2/R3 freeze.
p0:
  schema_version: 1
  protocol: staged_dynamics_p0_v1
  experiment_version: synthetic_p0_002_r1
  planning_round: R1
  roles:
    train:
      centers: 3
      phase_seeds_per_center: 2
      active_arm_groups: [both]
      batches: 2
      reference_seed_base: 110000
      acquisition_seed_base: 210000
      order_seed: 310000
    selection:
      centers: 2
      phase_seeds_per_center: 2
      active_arm_groups: [both]
      batches: 2
      reference_seed_base: 410000
      acquisition_seed_base: 510000
      order_seed: 610000
    test:
      centers: 2
      phase_seeds_per_center: 1
      active_arm_groups: [both, left, right]
      batches: 2
      reference_seed_base: 710000
      acquisition_seed_base: 810000
      order_seed: 910000
  center_design:
    candidate_seed: 120001
    candidate_pool_size: 256
    minimum_normalized_rms_distance: 0.2
    minimum_joint_difference_rad: 0.05
    minimum_different_joints: 2
    wrapping: forbidden
  wrist:
    joints: [4, 11]
    directions: [-1, 1]
    weighting: separately_reported
  final_prior_holdout:
    acquisition_seed_base: 1010000
    gravity_poses: 8  # two approaches per pose: 16 independent hold records
    friction_poses: 2  # 14 joints * 3 speeds * 2 poses: 84 bidirectional records
    breakaway_poses: 2  # 14 * 2 directions * 2 dwells * 2 slopes * 2 repeats: 448
    gravity_reference_seed: 1020000
    friction_reference_seed: 1030000
    breakaway_reference_seed: 1040000
    batches: 1
    role: final_test_only_after_candidate_freeze
    development_validation: existing_predecessor_validation_is_not_final_holdout
  weighting:
    trajectory: equal
    joint: equal_normalized_by_frozen_training_torque_rms
    torque_floor_nm: 0.2
    primary_wrist_sqrt_weight: 0.1
    wrist_probe: equal_trajectory_separate_block
  preprocessing:
    harmonics: 40
    phase_points: 1024
    discard_periods: 2
    friction_order: nonlinear_features_before_projection
  selection:
    ridge_candidates: [0.00001, 0.0001, 0.001]
    score: mean_trajectory_axis_nrmse
    tie_absolute_nrmse: 0.000001
    tie_break: stronger_regularization
    require_stability: true
    require_prior_development_gates: true
  stability:
    comparison_scale: frozen_nominal_physical_parameters
    center_deletions: 3
    batch_deletions: 2
    prior_variants: 4
    prior_seed: 130001
    prior_mass_relative: 0.1
    prior_com_component_m: 0.001
    prior_inertia_scale_relative: 0.1
    maximum_mass_relative_frobenius: 0.05
    maximum_mass_diagonal_relative: 0.1
    mass_diagonal_floor_kg_m2: 0.000001
    maximum_inverse_axis_normalized_rms: 0.02
    operator_probe_seed: 140001
    operator_probe_count: 128
  frequency_qualification:
    noise_seed: 150001
    noise_periods: 4
    noise_multiplier: 10.0
    minimum_bin_rms_nm: 0.0001
    minimum_speed_bin_rms_rad_s: 0.001
    minimum_acceleration_bin_rms_rad_s2: 0.001
  acceptance:
    dynamic_axis_nrmse: 0.05
    stationary_excess_nm: 0.01
    torque_floor_nm: 0.2
    wrist_inertia_relative: 0.1
    wrist_prediction_rmse_nm: 0.002
    repeat_residual_mean_difference_nm: 0.01
    mass_relative_frobenius: 0.05
    mass_diagonal_relative: 0.1
    inverse_axis_normalized_rms: 0.02
    band_non_degradation_factor: 1.05
    band_non_degradation_additive_nm: 0.002
    minimum_inertia_band_improvement_fraction: 0.01
  release:
    require_final_prior_holdout: true
    require_all_p0: true
    prediction_and_benefit_separate: true
    test_reuse_after_protocol_change: forbidden
