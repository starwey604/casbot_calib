command_period_ns: 2000000  # 500 Hz client plan, not motor acquisition frequency
collision_scene: collision_scene.yaml  # relative to this config
home_rad: [0, 0.85, 0, -0.9, 0, 0, 0, 0, -0.85, 0, -0.9, 0, 0, 0]
arms:
