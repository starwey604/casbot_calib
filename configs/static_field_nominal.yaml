notes:
  - Nominal model and unmeasured fixture proxy only; no hardware motion qualification.
  - Angles are offsets from home, never copied absolute six-axis SDK poses.
  - Synthetic shoulder-roll centers allow signed diagnostics; not a measured hardware start.
  - One arm moves at a time; both arms and fixed torso remain in collision/dynamics model.
  - Opposite approaches bracket stiction; do not guarantee its cancellation.
  - Measure windows are planned; cached publish stamps do not qualify as acquisition times.
