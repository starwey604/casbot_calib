    combination_joints: [left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_pitch_joint, left_wrist_yaw_joint, left_wrist_pitch_joint]
  right:
    single_axis_joints: [right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_pitch_joint, right_wrist_yaw_joint, right_wrist_pitch_joint, right_wrist_roll_joint]
    combination_joints: [right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_pitch_joint, right_wrist_yaw_joint, right_wrist_pitch_joint]
