[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "casbot-calib"
version = "0.1.0"
description = "Output-side joint calibration with a C++ virtual device"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.14", "PyYAML>=6", "matplotlib>=3.9"]

[project.optional-dependencies]
viewer = ["mujoco>=3.3,<4", "Pillow>=10", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
casbot-calib = "casbot_calib.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/casbot_calib"]
install.components = ["Python"]
sdist.include = ["configs/**", "docs/**", "tests/**", "cpp/**", "cmake/**", "ros/**", "scripts/humble/**", "CMakePresets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
