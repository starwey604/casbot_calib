[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "casbot-calib"
version = "0.1.0"
description = "CASBOT dual-arm calibration over the EtherCAT shared-memory interface"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.14", "PyYAML>=6", "matplotlib>=3.9"]

[project.optional-dependencies]
staged = ["clarabel>=0.11,<0.12"]
viewer = ["mujoco>=3.3,<4", "Pillow>=10", "imageio-ffmpeg>=0.6,<1"]
fieldwork-gui = ["imgui-bundle==1.5.2", "mujoco>=3.3,<4", "Pillow>=10", "PyOpenGL>=3.1.6", "imageio-ffmpeg>=0.6,<1"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/casbot_calib"]
install.components = ["Python"]
sdist.include = ["configs/**", "docs/**", "fieldwork/**", "tests/**", "cpp/**", "cmake/**", "scripts/humble/**", "scripts/shm/**", "scripts/cad/**", "scripts/import_collision_geometry.py", "CMakePresets.json", "python/casbot_calib/assets/models/**", "python/casbot_calib/assets/fieldwork_display/**"]
sdist.exclude = ["references/cad/**/*.stp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
