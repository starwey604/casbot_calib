[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "casbot-calib"
version = "0.1.0"
description = "Output-side joint calibration with a C++ virtual device"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "PyYAML>=6", "matplotlib>=3.9"]

[project.scripts]
casbot-calib = "casbot_calib.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/casbot_calib"]
sdist.include = ["configs/**", "docs/**", "tests/**", "cpp/**", "CMakePresets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
