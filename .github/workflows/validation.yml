name: Linux and Windows validation
on: [push, pull_request, workflow_dispatch]
jobs:
  calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: casbot_calib
          python-version: '3.12'
      - run: conda install -n base -c conda-forge conda-lock -y
      - run: conda run -n base conda-lock install --no-mamba -n casbot_calib conda-lock.yml
      - run: python -m pip install . --no-build-isolation --config-settings=cmake.args=--preset=conda
      - run: cmake --preset conda && cmake --build --preset conda && ctest --preset conda
      - run: python -m pytest -q
      - run: casbot-calib suite --configs configs --output artifacts/validation
      - run: casbot-calib arm-check --output artifacts/validation/R1
      - run: casbot-calib dual-calibrate --output artifacts/validation/D14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: calibration-${{ matrix.os }}
          path: artifacts/validation
  compare:
    needs: [calibration, humble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: calibration-*
          path: reports
      - run: python scripts/compare_reports.py reports/calibration-ubuntu-latest reports/calibration-windows-latest
      - run: python scripts/compare_reports.py reports/calibration-ubuntu-latest reports/calibration-humble/experiments
  humble:
    runs-on: ubuntu-latest
    container: osrf/ros:humble-desktop-full
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/humble/install_system.sh
      - run: bash scripts/humble/setup_python.sh
      - run: bash scripts/humble/run.sh bash scripts/humble/validate.sh artifacts/humble_validation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: calibration-humble
          path: artifacts/humble_validation
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      MUJOCO_GL: egl
      CASBOT_TEST_RENDER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1-mesa-dri fonts-noto-cjk
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: casbot_calib
          python-version: '3.12'
      - run: conda install -n base -c conda-forge conda-lock -y
      - run: conda run -n base conda-lock install --no-mamba -n casbot_calib conda-viewer-lock.yml
      - run: python -m pip install -e '.[viewer]' --no-build-isolation --no-deps --config-settings=cmake.args=--preset=conda
      - run: python -m pytest -q
      - run: casbot-calib demo --output artifacts/viewer_demo --fps 6
      - run: casbot-calib arm-check --output artifacts/viewer_demo/R1 --render
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: calibration-viewer
          path: artifacts/viewer_demo
